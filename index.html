<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação de Formulário</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <button
        id="temaBtn"
        aria-label="Alternar tema">
        🌙
    </button>

    <main class="container">

        <h1>Cadastro de Usuário</h1>

        <form id="cadastroForm" novalidate>

            <div class="campo">

                <label for="nome">
                    Nome
                </label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Digite seu nome">

                <small
                    class="erro"
                    id="erroNome">
                </small>

            </div>

            <div class="campo">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="text"
                    id="email"
                    placeholder="Digite seu e-mail">

                <small
                    class="erro"
                    id="erroEmail">
                </small>

            </div>

            <div class="campo">

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha">

                <small
                    class="erro"
                    id="erroSenha">
                </small>

            </div>

            <button type="submit">
                Enviar
            </button>

        </form>

        <div
            id="mensagemSucesso"
            aria-live="polite">
        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
